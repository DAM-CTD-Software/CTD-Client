fail_fast: true

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --no-sync ruff check
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
        args: [--fix]
      - id: ruff-imports
        name: Ruff import sorting
        entry: uv run --no-sync ruff check
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
        args: [--select, I, --fix]
      - id: ruff-format
        name: Ruff formatting
        entry: uv run --no-sync ruff format
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
