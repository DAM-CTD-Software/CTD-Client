name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    if: "!contains(github.event.head_commit.message, 'python-semantic-release')"
    name: Semantic Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7.3.1
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          uv sync --all-extras
          uv pip install python-semantic-release

      - name: Python Semantic Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          before=$(git describe --tags --abbrev=0 2>/dev/null || true)
          uv run semantic-release -v version --changelog
          after=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ "$after" != "$before" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "tag=$after"    >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi
          uv run semantic-release -v publish

      - name: Build docs
        if: "contains(github.event.head_commit.message, 'docs')"
        run: |
          mkdir docs/build/docs/ -p
          cp docs/images docs/build/docs -r
          uv run sphinx-apidoc -feo docs/source src/ctdclient
          uv run sphinx-build -b html docs/source docs/build

      - name: Deploy to gh-pages
        if: "contains(github.event.head_commit.message, 'docs')"
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/build
          publish_branch: gh-pages

  trigger_build_binary:
    needs: release
    if: needs.release.outputs.released == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/build-binary.yaml
    with:
      tag: ${{ needs.release.outputs.tag }}
